name: CI

# Las acciones están fijadas por hash de commit (especificación 3.11): una
# etiqueta como "v7" puede moverse; un hash no. Dependabot propone las
# actualizaciones y se revisan a mano.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, tests y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # .npmrc tiene ignore-scripts=true: ningún paquete ejecuta código al instalarse.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitarios
        run: npx vitest run --project unit
      - name: Cobertura de crypto (RNF-11)
        run: npm run test:coverage
      - name: Suite de seguridad (TS-xx)
        run: npm run test:security
      - name: Auditoría de dependencias
        run: npm run audit:deps

  electron:
    name: Análisis de configuración de Electron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Electronegativity corre aislado con npx: sus dependencias tienen
      # vulnerabilidades conocidas y no deben entrar al lockfile del proyecto.
      - name: Electronegativity
        run: npm run audit:electron
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: electronegativity.sarif
          category: electronegativity

  e2e:
    name: E2E de la app (Electron real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: calidad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scripts de instalación permitidos (binario de Electron)
        run: npm run setup:native
      - run: npm run build
      - name: Tests E2E
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reporte-e2e
          path: e2e-report/
          retention-days: 14
