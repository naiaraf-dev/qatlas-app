name: CI

# Las acciones están fijadas por hash de commit (especificación 3.11): una
# etiqueta como "v7" puede moverse; un hash no. Dependabot propone las
# actualizaciones y se revisan a mano.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, tests y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # .npmrc tiene ignore-scripts=true: ningún paquete ejecuta código al instalarse.
      - run: npm ci
      # Las respuestas de atestaciones que trae la caché de npm (restaurada por setup-node): solo las muestra,
      # para saber si una incompleta quedó guardada. No falla ni borra (ADR 044).
      - name: Atestaciones en la caché de npm
        run: node scripts/diagnostico-atestaciones.mjs --cache "$(npm config get cache)"
      # Firmas del registro de npm y procedencia de cada paquete instalado. --prefer-online: npm revalida con
      # el registro lo que tiene en caché (las atestaciones se cachean un año), así que se verifica contra
      # lo que el registro sirve hoy. La verificación es la misma: nada se saltea.
      - name: Firmas de los paquetes
        run: npm audit signatures --prefer-online
      # Cada .node de cada plataforma, contra el registro revisado (ADR 007).
      - name: Módulos nativos registrados
        run: npm run nativos:verificar
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitarios
        run: npx vitest run --project unit
      - name: Cobertura de crypto (RNF-11)
        run: npm run test:coverage
      - name: Suite de seguridad (TS-xx)
        run: npm run test:security
      - name: Auditoría de dependencias
        run: npm run audit:deps

  electron:
    name: Análisis de configuración de Electron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Electronegativity corre aislado con npx: sus dependencias tienen
      # vulnerabilidades conocidas y no deben entrar al lockfile del proyecto.
      - name: Electronegativity
        run: npm run audit:electron
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: electronegativity.sarif
          category: electronegativity

  # El E2E en partes paralelas (ADR 044). Las partes las define scripts/e2e-partes.mjs, y
  # security-tests/e2e-etiquetas.test.ts verifica que esta lista coincida y que cada test caiga en
  # exactamente una. Todas son checks obligatorios.
  e2e:
    name: E2E ${{ matrix.numero }}/5 · ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: calidad
    strategy:
      fail-fast: false
      matrix:
        include:
          - { numero: 1, nombre: 'rápidos' }
          - { numero: 2, nombre: 'Bóveda: inactividad' }
          - { numero: 3, nombre: 'contención: solo lectura' }
          - { numero: 4, nombre: 'ejecuciones y escaneos' }
          - { numero: 5, nombre: 'OCR y evidencias' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-e2e
      - name: Tests E2E de la parte
        env:
          PARTE: ${{ matrix.numero }}
        run: |
          inicio=$SECONDS
          set +e
          xvfb-run -a npm run test:e2e:parte -- "$PARTE"
          estado=$?
          set -e
          echo "Duración de la parte $PARTE: $((SECONDS - inicio)) s" >> "$GITHUB_STEP_SUMMARY"
          exit $estado
      # El Chromium no cambió mientras corrían los tests (ADR 020).
      - run: npm run navegador:verificar
      # Los tests de crypto también dentro de Electron (BoringSSL). Una sola vez: en la parte 1.
      - name: Crypto en Electron
        if: matrix.numero == 1
        run: xvfb-run -a npm run test:crypto:electron
      - name: Procesos y memoria de cada archivo
        if: always()
        run: |
          {
            echo '```'
            cat test-results/procesos-y-memoria.txt 2>/dev/null || echo 'sin registro'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # El repo es público y estos artifacts también: cualquiera puede descargarlos mientras duran.
      # Solo contienen datos ficticios: los E2E usan contraseñas y secretos inventados y una carpeta
      # temporal, nunca una bóveda real. Este job no recibe secretos del repositorio.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blob-report-${{ matrix.numero }}
          path: blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: resultados-e2e-${{ matrix.numero }}
          path: test-results/
          retention-days: 7

  # Junta los reportes de las partes en uno HTML. Corre aunque alguna falle, y falla si alguna falló.
  e2e-reporte:
    name: E2E · reporte unificado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [calidad, e2e]
    if: ${{ !cancelled() }}
    steps:
      # Si no corrió ninguna parte, no hay reportes que juntar: se dice por qué, en vez de fallar más abajo
      # con «Directory does not exist».
      - name: Partes del E2E que corrieron
        if: needs.e2e.result == 'skipped'
        run: |
          echo "::error title=E2E::No corrió ninguna parte del E2E porque falló el job «Lint, tipos, tests y seguridad» (${{ needs.calidad.result }})."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blobs
          merge-multiple: true
      # Las partes corrieron, pero ninguna llegó a subir su reporte (por ejemplo, fallaron al prepararse).
      - name: Reportes de las partes
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(ls -A blobs 2>/dev/null)" ]; then
            echo "::error title=E2E::Ninguna parte del E2E subió su reporte (resultado de las partes: ${{ needs.e2e.result }}). Ver los logs de cada parte."
            exit 1
          fi
      - name: Reporte unificado
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e-report
        run: npx playwright merge-reports --reporter html ./blobs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-e2e
          path: e2e-report/
          retention-days: 7
      - name: Resultado de las partes
        if: needs.e2e.result != 'success'
        run: |
          echo "Al menos una parte del E2E falló: ${{ needs.e2e.result }}"
          exit 1
